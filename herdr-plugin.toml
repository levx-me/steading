# Steading: an agentic development environment on top of herdr.
#
# First module, the deck: the agent's builds, tests and dev servers in read-only
# viewer panes beside it (servers and build on top, tests taking the rest).
# The Claude Code hook (hooks/hooks.json) routes those runs into the panes;
# installing this herdr plugin also installs that hook when Claude Code is present.

id = "steading"
name = "Steading"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Agentic development environment for herdr: builds, tests and dev servers in panes beside the agent"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "bin/install-claude"]

[[actions]]
id = "install-claude"
title = "Steading: install the Claude Code hook"
contexts = ["global"]
command = ["sh", "bin/install-claude"]

[[actions]]
id = "toggle"
title = "Steading: open or close the deck"
contexts = ["global", "workspace", "pane"]
command = ["bin/deck", "toggle"]

# Any agent herdr recognises gets a deck as it starts (claude, codex, opencode ...).
[[events]]
on = "pane.agent_detected"
command = ["bin/deck", "auto"]

# The deck itself: herdr starts it straight in a split, with no shell first.
[[panes]]
id = "deck"
title = "Steading"
placement = "split"
command = ["bin/py", "bin/viewer.py"]
